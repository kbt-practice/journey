# =====================================================================
# eck-elasticsearch 0.20.0
#  - xpack.security.*는 ECK가 예약한 설정이라 사용자가 끄면 안 된다.
#    끄면 ECK가 넣는 file settings의 role_mappings를 파싱할 핸들러가 없어져
#    file settings 적용이 영구 실패하고, 그 결과 ES readiness 포트(8080)가
#    열리지 않아 pod가 영원히 0/1에 머무른다. (인증은 켠 채로 운용)
#  - backend(backend-ns)는 es-ns의 elastic 유저 Secret을 직접 참조할 수 없어
#    (Secret은 네임스페이스 간 참조 불가) 자격증명을 backend-ns Secret에 복사해서 쓴다.
# =====================================================================
eck-elasticsearch:
  fullnameOverride: amumal-search
  version: 9.4.2
  image: mingkiboo/amumal-es-nori:9.4.2

  http:
    # ClusterIP로만 노출되는 클러스터 내부 통신이라 HTTP 구간은 평문으로 둔다.
    # (CA를 backend에 배포하는 부담을 피하려는 것이고, 인증과 노드 간 transport TLS는 그대로 유지된다.)
    tls:
      selfSignedCertificate:
        disabled: true
    service:
      spec:
        type: ClusterIP

  volumeClaimDeletePolicy: DeleteOnScaledownOnly

  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          # regcred는 backend-ns에 있는 Secret이라 여기서 못 쓴다 (Secret은 네임스페이스 간 참조 불가).
          # es-ns에 동일한 이름으로 별도 생성해서 쓴다 (kubectl로 수동 생성, git에는 안 커밋).
          imagePullSecrets:
            - name: regcred
          # 컨테이너 레벨(allowPrivilegeEscalation/capabilities/readOnlyRootFilesystem)은
          # ES 8.8+부터 ECK가 기본으로 넣어줘서 여기선 ECK가 안 채워주는 pod 레벨만 명시한다.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            # portainer의 프로비저너 재사용
            storageClassName: portainer-local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
