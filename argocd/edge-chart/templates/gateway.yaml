# GatewayClass + EnvoyProxy + Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClassName }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Values.envoyProxy.name }}
    namespace: {{ .Values.envoyProxy.namespace }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.envoyProxy.name }}
  namespace: {{ .Values.envoyProxy.namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        externalTrafficPolicy: Local
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  nodePort: {{ .Values.envoyProxy.nodePort.http }}
                - name: https-443
                  port: 443
                  nodePort: {{ .Values.envoyProxy.nodePort.https }}
      envoyDeployment:
        replicas: {{ .Values.envoyProxy.replicas }}
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        patch:
          type: StrategicMerge
          value:
            spec:
              # replicas 수 == 배치 가능한 워커 수 + 노드당 하나(required anti-affinity) 조합이라
              # 기본값(maxSurge 1)으로는 새 파드를 올릴 노드가 없어 롤아웃이 영구히 멈춘다.
              # 먼저 하나 내리고 그 자리에 새로 올리도록 surge를 0으로 둔다.
              strategy:
                rollingUpdate:
                  maxSurge: 0
                  maxUnavailable: 1
              template:
                spec:
                  affinity:
                    podAntiAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        - labelSelector:
                            matchExpressions:
                              - key: gateway.envoyproxy.io/owning-gateway-name
                                operator: In
                                values:
                                  - {{ .Values.gatewayName }}
                          topologyKey: kubernetes.io/hostname
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gatewayName }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.tls.secretName }}
